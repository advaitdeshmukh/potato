<style>
  #annotation-forms {
    display: grid;
    grid-template-columns: minmax(0, 1fr) clamp(280px, 24vw, 360px);
    gap: 1rem 1.25rem;
    align-items: start;
  }

  #annotation-forms > .pairwise-items-display-container {
    grid-column: 1;
    min-width: 0;
    margin-bottom: 0;
  }

  #annotation-forms > .annotation_schema {
    grid-column: 2;
    position: sticky;
    top: 1rem;
    min-width: 0;
  }

  .pairwise-items-display {
    gap: 1rem;
    margin-bottom: 0;
  }

  .pairwise-item-title {
    font-size: 0.95rem;
    color: #243244;
    border-bottom-color: #b8c2cf;
  }

  .pairwise-item-box {
    max-height: min(66vh, 760px);
    min-height: 380px;
    border-color: #cfd7e3;
    border-radius: 8px;
    background: #fff;
    font-size: 0.94rem;
    line-height: 1.55;
  }

  .cluster-decision-panel {
    border: 1px solid #cfd7e3;
    border-radius: 8px;
    background: #fff;
    padding: 1rem;
    box-shadow: 0 8px 24px rgba(25, 35, 50, 0.08);
  }

  .cluster-decision-panel fieldset {
    border: 0;
    margin: 0;
    padding: 0;
  }

  .cluster-decision-panel .pairwise-question {
    margin: 0 0 0.45rem;
    color: #182332;
    font-size: 1rem;
    line-height: 1.3;
  }

  .cluster-decision-help {
    margin: 0 0 0.9rem;
    color: #58677a;
    font-size: 0.88rem;
    line-height: 1.45;
  }

  .cluster-choice-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.65rem;
    width: 100%;
    margin: 0;
  }

  .cluster-choice-grid .pairwise-tile {
    justify-content: space-between;
    min-width: 0;
    max-width: none;
    width: 100%;
    border-width: 1px;
    padding: 0.8rem 0.9rem;
    border-radius: 8px;
  }

  .cluster-choice-grid .pairwise-tile[data-value="same_cluster"] {
    border-left: 4px solid #15803d;
  }

  .cluster-choice-grid .pairwise-tile[data-value="different_cluster"] {
    border-left: 4px solid #b45309;
  }

  .cluster-choice-grid .pairwise-tile.selected::after {
    top: 50%;
    right: 0.8rem;
    transform: translateY(-50%);
  }

  .cluster-choice-grid .pairwise-tile.selected .pairwise-tile-shortcut {
    margin-right: 1.8rem;
  }

  .cluster-decision-panel .pairwise-extra-options {
    display: block;
    width: 100%;
    margin: 0.65rem 0 0;
  }

  .cluster-decision-panel .pairwise-tie-btn {
    width: 100%;
    border-radius: 8px;
    padding: 0.75rem 0.9rem;
    text-align: left;
  }

  @media (max-width: 1100px) {
    #annotation-forms {
      display: block;
    }

    #annotation-forms > .annotation_schema {
      position: static;
      margin-top: 1rem;
    }

    .pairwise-items-display {
      display: block;
    }

    .pairwise-item-wrapper + .pairwise-item-wrapper {
      margin-top: 1rem;
    }

    .pairwise-item-box {
      min-height: 260px;
      max-height: 52vh;
    }
  }
</style>

<div class="annotation_schema">
  <form id="cluster_match" class="annotation-form pairwise pairwise-binary cluster-decision-panel" action="/action_page.php" data-annotation-id="0" data-annotation-type="pairwise" data-schema-name="cluster_match" data-mode="binary" data-items-key="text" data-item-display-mode="side_by_side" data-show-item-diff="true" data-diff-granularity="word" data-diff-ignore-case="true" data-diff-ignore-punctuation="true" data-item-label-a="Prompt A" data-item-label-b="Prompt B">
    <fieldset schema="cluster_match">
      <legend class="pairwise-question">Do these prompts belong in the same story-prompt cluster?</legend>
      <p class="cluster-decision-help">Use same cluster for near-duplicate variants of the same requested story task. Use different cluster when the task, characters, setting, or intent has materially changed.</p>

      <div class="pairwise-selection-container cluster-choice-grid">
        <div class="pairwise-tile" data-value="same_cluster" data-schema="cluster_match" tabindex="0" data-key="1">
          <span class="pairwise-tile-label">Same cluster</span>
          <span class="pairwise-tile-shortcut">1</span>
        </div>
        <div class="pairwise-tile" data-value="different_cluster" data-schema="cluster_match" tabindex="0" data-key="2">
          <span class="pairwise-tile-label">Different cluster</span>
          <span class="pairwise-tile-shortcut">2</span>
        </div>
      </div>

      <div class="pairwise-extra-options">
        <button type="button" class="pairwise-tie-btn" data-value="tie" data-schema="cluster_match" data-key="0">
          Unsure <span class="pairwise-tile-shortcut">0</span>
        </button>
      </div>

      <input type="hidden" class="pairwise-value annotation-input" name="cluster_match" schema="cluster_match" label_name="selection" validation="required" value="">
    </fieldset>
  </form>
</div>
