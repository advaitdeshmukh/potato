port: 9007
server_name: potato annotator
annotation_task_name: Story Prompt Validation

task_dir: .
site_dir: default

output_annotation_dir: data/annotations/story-prompt-validation/
output_annotation_format: jsonl
annotation_codebook_url: ""
task_layout: layouts/task_layout.html


data_files:
  - data/story-prompt-validation-qwen35-hosted-input.jsonl

item_properties:
  id_key: id
  text_key: text

instance_display:
  layout:
    direction: horizontal
    gap: 16px
  fields:
    - key: text
      type: text
      label: "Prompt"
      display_options:
        preserve_whitespace: true
        collapsible: false
        max_height: 520

user_config:
  allow_all_users: true
  users: []

jumping_to_id_disabled: true
alert_time_each_instance: 10000000
horizontal_key_bindings: true

annotation_schemes:
  - annotation_type: radio
    name: is_story_prompt
    description: >-
      Definition: Mark True if the user prompt is asking the model to
      generate stories. This includes any request that involves inventing
      characters, events, dialogue, or scenes. Mark True if the prompt
      requests a short story, scene, novel-style excerpt, fan fiction,
      narrative written from a character's perspective, or creative fictional
      version of events. Mark False if the prompt asks for factual summaries
      or explanations, essays, reports, analysis, jokes or non-narrative
      creative writing, informational or instructional content, roleplaying,
      character descriptions, or other narrative-like texts that are not
      themselves stories. If the output is a story, it should probably be
      marked True. If the task requires inventing a story with characters and
      events, mark True.
    labels:
      - name: "True"
        text: "True - story prompt"
        tooltip: "The prompt asks the model to generate a story, scene, fan fiction, narrative, or fictional events."
      - name: "False"
        text: "False - not a story prompt"
        tooltip: "The prompt asks for non-story content, such as facts, analysis, instructions, jokes, roleplay setup, or character description."
    sequential_key_binding: true
    label_requirement:
      required: true

admin_api_key: "test"
