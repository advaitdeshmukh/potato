server:
  host: 0.0.0.0
  port: 4097
  base_path: /tejo9855/agency
  workers: 2
  timeout: 120

server_name: potato annotator
annotation_task_name: Agency Annotation

task_dir: .

data_files:
  - data/dolma_final_sample_s42_n1250_t0.5_llm_summary_safeid_with_spans.csv
output_annotation_dir: annotation_output/results/
output_annotation_format: json
annotation_codebook_url: "https://docs.google.com/document/d/1gFhirrtkVxULWeZeEXqL_9aptCoO5QlJzsspeLxvt-g/edit?usp=sharing"

item_properties:
  id_key: safe_instance_id
  text_key: sampled_text
  kwargs:
    - source
    - llm_summary
    - id
    - folder
    - topic_classification

user_config:
  allow_all_users: true
  users: []

list_as_text:
  text_list_prefix_type: none
  horizontal: true

alert_time_each_instance: 100000

annotation_schemes:
  - annotation_type: likert
    name: agency_focalization
    description: "How central is a specific character's/narrator's perspective to the text?"
    # definition + examples are mirrored verbatim in layouts/task_layout_custom.html
    # (_agencyFeatureInfo). Keep the two in sync. Scores 5/3/1 are from the paper's
    # agency prompt (Fig. A22); scores 2/4 are authored from rubric tables A9-A13.
    definition: "Whether the reader experiences events through a specific perceiving consciousness's inner life, regardless of the formal mechanism: first-person interiority, close third person, free indirect discourse, or direct quotation of inner experience. Instructional or legal \"you\" scores low; an immersive second-person perspective can score high."
    examples:
      - { score: 5, text: "she scanned the faces in the crowd, certain that someone was watching her", why: "fully organized around her perception and inner certainty" }
      - { score: 4, text: "He gathered his things, replaying the interviewer's last question, certain he'd fumbled it.", why: "events predominantly filtered through his inner life, with only occasional external description" }
      - { score: 3, text: "He wasn't sure the meeting had gone well. He gathered his things and headed for the door.", why: "a perspective is present but external action and inner access are roughly balanced" }
      - { score: 2, text: "She left the office, shoulders tight, and caught the last train home.", why: "a perspective is faintly implied through behavior but does not shape how events are told" }
      - { score: 1, text: "she walked through the crowd.", why: "a purely external vantage with no access to any inner experience" }
    size: 5
    min_label: "Not at all"
    max_label: "Extremely"
    label_requirement:
      required: false

  - annotation_type: likert
    name: agency_emotion
    description: "How central are a character's emotional states to the text?"
    definition: "Centrality of a character's emotional states. Descriptions of emotional behavior can contribute to the score, but internal access to how a character feels raises it further."
    examples:
      - { score: 5, text: "Completely paralyzed with fear, he was all of a sudden flooded with relief when he heard her voice", why: "emotional experience dominates, with sustained, direct access to feeling" }
      - { score: 4, text: "Her chest tightened as she opened the letter; by the last line she was blinking back tears.", why: "emotion is prominent and shapes the passage, with meaningful access to how she feels" }
      - { score: 3, text: "She was nervous about the presentation. She went into the interview room.", why: "an emotional state is present and noticeable but not the organizing feature" }
      - { score: 2, text: "He tapped his pen against the desk and cleared his throat before answering.", why: "emotion is faintly implied through a gesture, not elaborated or sustained" }
      - { score: 1, text: "he answered the phone.", why: "no reference to how any character feels" }
    size: 5
    min_label: "Not at all"
    max_label: "Extremely"
    label_requirement:
      required: false

  - annotation_type: likert
    name: agency_cognition
    description: "How central are a character's thoughts, reasoning, or motivations to the text?"
    definition: "Centrality of a character's thoughts, reasoning, and motivations. This targets cognitive and reasoning interiority (beliefs, deliberation, goals, desires) rather than perceptual or emotional interiority."
    examples:
      - { score: 5, text: "she kept turning the problem over in her mind, convinced there was something she had missed. Was it because they were so quiet in the meeting? Or their body language? She couldn't tell.", why: "the passage is dominated by her reasoning and deliberation" }
      - { score: 4, text: "He weighed the two offers again, telling himself the safer one was smarter even as he leaned toward the other.", why: "his reasoning and motivations are prominent and shape the passage" }
      - { score: 3, text: "She read the email twice. It wasn't entirely clear what they were asking for, but she thought she understood the gist. She drafted a reply.", why: "thoughts and reasoning are present and contribute but are not the dominant feature" }
      - { score: 2, text: "He glanced at the map, then chose the left fork.", why: "a mental decision is faintly implied but incidental, not elaborated" }
      - { score: 1, text: "she sat at her desk", why: "no reference to what any character thinks, intends, or wants" }
    size: 5
    min_label: "Not at all"
    max_label: "Extremely"
    label_requirement:
      required: false

  - annotation_type: likert
    name: agency_change_of_state
    description: "How central is a change in a character's condition or state to the text?"
    definition: "Centrality of a change in a character's condition (physical, psychological, relational, or existential). In-progress or partially implied changes count, and a world event that necessarily entails a change (a company going bankrupt, a death) counts even if the internal response isn't elaborated. Rate the presence and centrality of the change itself, independent of how vividly it is rendered."
    examples:
      - { score: 5, text: "by the time she reached the door, something in her had shifted. She wasn't the same person who had walked in", why: "the transformation is what the passage is fundamentally about" }
      - { score: 4, text: "The bankruptcy notice arrived on Tuesday; by Friday the shop that had been his whole life was empty.", why: "a consequential change in his condition is prominent and organizes the passage" }
      - { score: 3, text: "By the end of the conversation he felt somewhat better about the situation. It wasn't resolved, but it seemed more manageable than it had before.", why: "a change in condition is present and meaningful but not dominant" }
      - { score: 2, text: "She finished the last box, glanced around the emptier room, and kept unpacking.", why: "a minor or incidental change is implied but is not an organizing feature" }
      - { score: 1, text: "she sat at her desk.", why: "the character remains essentially unchanged; no change present or implied" }
    size: 5
    min_label: "Not at all"
    max_label: "Extremely"
    label_requirement:
      required: false

  - annotation_type: likert
    name: agency_conflict
    description: "How central is conflict involving characters to the text?"
    definition: "Centrality of opposition or tension. Conflict can be interpersonal (character vs. character), internal (character vs. self), or against institutions, environments, objects, social forces, or physical events."
    examples:
      - { score: 5, text: "they had been arguing for hours, neither willing to give ground. The people around them started to stare. They were so caught up in the fight that they didn't even notice.", why: "opposition dominates and is sustained throughout" }
      - { score: 4, text: "She kept pushing back against the new policy, emailing managers who never replied, refusing to let it go.", why: "conflict (here against an institution) is prominent and shapes the passage" }
      - { score: 3, text: "They disagreed about the route. They took the highway and didn't talk much for the first hour.", why: "conflict is present and noticeable but not the dominant feature" }
      - { score: 2, text: "He bit back a reply and went along with the plan.", why: "a hint of tension is present but stays in the background" }
      - { score: 1, text: "they sat across from each other at the table.", why: "no conflict of any kind is present or implied" }
    size: 5
    min_label: "Not at all"
    max_label: "Extremely"
    label_requirement:
      required: false

ui:
  show_progress: true
  show_instructions: true
  allow_navigation: true
  allow_editing: true

instance_display:
  resizable: false
  fields:
    - key: source
      type: text
    - key: llm_summary
      type: text
    - key: sampled_text
      type: text

task_layout: layouts/task_layout_custom.html
site_dir: default
