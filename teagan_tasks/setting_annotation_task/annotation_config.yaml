server:
  host: 0.0.0.0
  port: 4098
  base_path: /tejo9855/setting
  workers: 2
  timeout: 120

server_name: potato annotator
annotation_task_name: Setting Annotation

task_dir: .

data_files:
  - data/dolma_final_sample_s42_n1250_t0.5_llm_summary_safeid_with_spans.csv
output_annotation_dir: annotation_output/results/
output_annotation_format: json
annotation_codebook_url: "https://docs.google.com/document/d/1JSABU6YoxlWyzOmb4KBM1CwSG-xu9ofAihqXzsFTTUE/edit?usp=sharing"

item_properties:
  id_key: safe_instance_id
  text_key: sampled_text
  kwargs:
    - source
    - llm_summary
    - id
    - folder
    - topic_classification

user_config:
  allow_all_users: true
  users: []

list_as_text:
  text_list_prefix_type: none
  horizontal: true

alert_time_each_instance: 100000

annotation_schemes:
  - annotation_type: likert
    name: setting_concreteness
    description: "How concrete is the language of the text?"
    # definition + examples are rendered directly by layouts/task_layout_custom.html.
    # Scores 5/3/1 are from the paper's setting prompt (Fig. A23); scores 2/4 are
    # authored from rubric tables A14-A17.
    definition: "How tangible and non-abstract the language is: could the content be explained by pointing, demonstrating, or showing (objects, physical states, bodily actions, perceptual qualities), or only by verbal definition (categories, principles, institutions, ideas)? Concreteness is not the same as specificity. Naming entities does not by itself raise the score unless they are rendered perceptually."
    examples:
      - { score: 5, text: "the chipped blue mug sat on the edge of the sink, handle cracked from years of use", why: "physical referents richly rendered; dense with perceptual particulars" }
      - { score: 4, text: "Rain streaked the workshop window above a bench cluttered with clamps, curls of pine shaving, and a half-sanded chair leg.", why: "tangible things rendered with clear perceptual detail; the scene is picturable" }
      - { score: 3, text: "She had been commuting to the same office for six years. The building was on a corner downtown, glass and steel, indistinguishable from the ones on either side of it.", why: "physical referents present with some rendering, but perceptual detail is thin" }
      - { score: 2, text: "The company moved its headquarters and hired two hundred staff.", why: "physical entities are named but not rendered, with no shape, color, or texture" }
      - { score: 1, text: "people often form attachments to everyday objects", why: "entirely abstract; nothing could be explained by pointing" }
    size: 5
    min_label: "Not at all"
    max_label: "Extremely"
    label_requirement:
      required: false

  - annotation_type: likert
    name: setting_temporal_grounding
    description: "How strongly does the text create a sense of being anchored in a particular time?"
    definition: "How strongly the text anchors the reader in a particular time. Two types contribute: historical grounding, a specific, unrepeatable moment (a year, an era, a named event), which has a high ceiling even when the language is sparse; and cyclical grounding, a recurring temporal structure (a season, a time of day), which on its own typically reaches only the middle of the scale. This is about a felt sense of time through description and atmosphere, not just explicit dates."
    examples:
      - { score: 5, text: "It was the summer of 2015 at 9:02am, before the world changed forever.", why: "historical and cyclical grounding work together for vivid temporal immersion" }
      - { score: 4, text: "In the winter of 1943, the depot ran day and night.", why: "historical grounding: a specific year/era anchors an identifiable moment" }
      - { score: 3, text: "This unique summer school gives teenagers the opportunity to work with tutors and musicians.", why: "cyclical grounding (a season) gives a felt sense of when; cyclical-only tends to cap here" }
      - { score: 2, text: "A few years ago, before all this, she had taken the same road every morning.", why: "relative markers order events but do not locate the reader in a particular time" }
      - { score: 1, text: "he walked outside.", why: "no markers of time; it could be happening at any point" }
    size: 5
    min_label: "Not at all"
    max_label: "Extremely"
    label_requirement:
      required: false

  - annotation_type: likert
    name: setting_spatial_grounding
    description: "How strongly does the text create a sense of being anchored in a particular place?"
    definition: "How strongly the text anchors the reader in a particular place. Two types contribute: geographic grounding, a country, city, or named landmark, which can reach the top of the scale on its own; and proximate grounding, an immediate physical environment (a room, a building, a street), which needs rendering to score high, so vivid proximate grounding without geographic grounding caps just below the top. This is about a felt sense of place, not just nominal mentions of locations."
    examples:
      - { score: 5, text: "In the narrow streets of Naples, the apartment's tiled floors kept cool even in August heat.", why: "geographic and proximate grounding combine with rich rendering" }
      - { score: 4, text: "The workshop smelled of sawdust and hot metal, tools hung in careful rows along the far wall.", why: "a proximate environment rendered vividly enough to feel present (no geographic anchor, so it caps here)" }
      - { score: 3, text: "She worked at an office in London.", why: "a named geographic location places the reader on the globe without evoking it" }
      - { score: 2, text: "She sat in the kitchen.", why: "a bare proximate location with no rendering, only that a space exists" }
      - { score: 1, text: "She decided to quit her job.", why: "no markers of place; it could be happening anywhere" }
    size: 5
    min_label: "Not at all"
    max_label: "Extremely"
    label_requirement:
      required: false

  - annotation_type: likert
    name: setting_sensory
    description: "How central are sensory details to the text?"
    definition: "Centrality of sensory experience across modalities: how the world looks, sounds, smells, feels, or tastes. This is distinct from concreteness: a passage can be concrete without foregrounding any particular sense. What matters is whether a sense modality is central to how the passage is organized, and how vividly it is rendered."
    examples:
      - { score: 5, text: "the bread was still warm, its crust crackling under her fingers, the whole kitchen thick with the smell of it", why: "organized around sensory experience across modalities, richly rendered" }
      - { score: 4, text: "The whole train car reeked of wet wool and diesel, and she breathed through her mouth the entire ride.", why: "a sense (smell) is prominent and clearly organizes the passage, even if not richly detailed" }
      - { score: 3, text: "The bread was still warm when she pulled it from the oven. She set it on the rack and went to wash her hands.", why: "a sense modality contributes meaningfully but is not the organizing feature" }
      - { score: 2, text: "The office was quiet as she typed up the report.", why: "a sense is implied but peripheral; removing it would not change the passage" }
      - { score: 1, text: "she made breakfast which consisted of bread and eggs.", why: "no appeal to the senses; no modality invoked" }
    size: 5
    min_label: "Not at all"
    max_label: "Extremely"
    label_requirement:
      required: false

ui:
  show_progress: true
  show_instructions: true
  allow_navigation: true
  allow_editing: true

instance_display:
  resizable: false
  fields:
    - key: source
      type: text
    - key: llm_summary
      type: text
    - key: sampled_text
      type: text

task_layout: layouts/task_layout_custom.html
site_dir: custom_templates
